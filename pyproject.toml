[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection-foundation"
version = "0.1.0"
description = "Simple YOLO-based fall detection project foundation"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7,<4",
  "scikit-learn>=1.3,<2",
  "scikit-image>=0.22,<1",
  "joblib>=1.3",
  "PyYAML>=6.0,<7",
  "ultralytics>=8.3,<9",
  "numpy>=1.24",
  "Pillow>=10.0",
  "opencv-python>=4.10,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fall-hog = "hog_svm.pipeline:main"
fall-train = "yolov8.train:main"
fall-evaluate = "yolov8.evaluate:main"
fall-detect = "yolov8.detect:main"
fall-geometry = "bounding_box.geometry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
